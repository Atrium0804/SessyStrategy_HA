# MkDocs Configuration for SessyStrategy HA Documentation
# This configuration file enables static site generation using MkDocs
# Run with: mkdocs serve (development) or mkdocs build (production)

site_name: SessyStrategy HA Documentation
site_description: Complete documentation for SessyStrategy HA - Smart battery charging strategy for Home Assistant + Sessy
site_author: SessyStrategy Team
site_url: https://github.com/your-repo/sessy-strategy-ha

# Repository information
repo_name: SessyStrategy HA
repo_url: https://github.com/your-repo/sessy-strategy-ha
edit_uri: edit/main/docs/

# Documentation directory
# Note: If you change this, move mkdocs.yml into the docs directory
docs_dir: docs

# Theme configuration — Material with NS corporate branding.
# Colors and fonts are defined in stylesheets/extra.css (see reference/brand-tokens.md).
theme:
  name: material
  language: en
  # Polyfills localStorage on file:// (disk) opens where Chromium blocks it — see overrides/main.html.
  custom_dir: overrides
  # logo: assets/logo.png       # Optional: add an NS-branded logo here
  # favicon: assets/favicon.ico # Optional: add a favicon here
  palette:
    # Light mode (default)
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Fonts are provided by the OS (NS Sans is installed on corporate laptops).
  # Disabling Material's Google Fonts loader keeps NS Sans + local fallbacks (see extra.css).
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

# Navigation structure
nav:
  - Home: index.md

  # Tutorials Section
  - Tutorials:
    - tutorials/getting-started.md
    - tutorials/first-day-operation.md
    - tutorials/dashboard-setup.md

  # How-to Guides Section
  - How-to Guides:
    - how-to/configure-seasonal-mode.md
    - how-to/tune-price-thresholds.md
    - how-to/override-manual-mode.md
    - how-to/add-live-tuning-helpers.md
    - how-to/debug-strategy-decisions.md
    - how-to/migrate-from-older-version.md

  # Explanations Section
  - Explanations:
    - explanation/strategy-priority-chain.md
    - explanation/price-basis-raw-vs-import.md
    - explanation/adaptive-spread-windows.md
    - explanation/setpoint-types-explained.md
    - explanation/seasonal-operation.md
    - explanation/arbitrage-margin.md

  # Reference Section
  - Reference:
    - Configuration:
      - reference/configuration/apps-yaml.md
    - Entities:
      - reference/entity-reference.md
      - reference/live-tuning-entities.md
      - reference/status-sensor-attributes.md
    - Services:
      - reference/service-calls.md
    - Architecture:
      - reference/architecture.md
    - Algorithms:
      - reference/algorithms.md

  # Contributing / meta documentation
  - Contributing:
    - Documentation guide: DOCUMENTATION_GUIDE.md
    - Brand & theme tokens: reference/brand-tokens.md

# Extensions (for advanced Markdown features)
markdown_extensions:
  # Standard extensions
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      baselevel: 2
      separator: "-"

  # PyMdown Extensions (enhance Markdown)
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  # Convert GitHub-style alerts (> [!NOTE]) in source to Material admonitions (ADR-TPD030).
  - callouts
  - search:
      lang: en
      separator: '[\s\-]+'
  - git-revision-date-localized:
      enabled: true
      fallback_to_build_date: true
      type: datetime
      timezone: Europe/Amsterdam
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true


# Extra configuration
extra:
  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-repo/sessy-strategy-ha
    - icon: fontawesome/brands/git
      link: https://github.com/your-repo

  # Version information (for version selector)
  version:
    provider: mike
    default: latest

# Copyright and footer
copyright: |
  &copy; 2026 SessyStrategy Team<br>
  Documentation built with <a href="https://www.mkdocs.org/" target="_blank">MkDocs</a> &nbsp;
  <a href="https://diataxis.fr/" target="_blank">Diátaxis Framework</a>

# Google Analytics (optional - uncomment to enable)
#google_analytics:
#  - "UA-XXXXXXXX-X"
#  - auto

# Custom CSS (NS corporate styling — see reference/brand-tokens.md)
extra_css:
  - stylesheets/extra.css

# Page tree configuration
# use_directory_urls: false makes the built site browsable directly from disk
# (file://) — links become explicit .html files instead of folder URLs.
use_directory_urls: false
strict: false

# Dev server configuration
dev_addr: 0.0.0.0:8000
watch:
  - docs
  - mkdocs.yml