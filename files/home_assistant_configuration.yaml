# ============================================================================
# NOTE: Entity ID Mapping
# ============================================================================
# Make sure these entity IDs match what you configured in apps.yaml:
# - sensor.boiler_temperatuur -> temp_sensor
# - sensor.sessy_dnhh_energy_price -> price_forecast_sensor
# - input_select.boiler_strategy_mode -> mode_select
# - select.boiler_mode -> boiler_mode_select
# - input_datetime.boiler_legionella_last_ok -> legionella_last_ok_entity
# - sensor.boiler_strategy_status -> status_sensor