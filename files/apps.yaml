sessy_strategy:
  module: sessy_strategy
  class: SessyStrategy

  # ── Battery / hardware ──────────────────────────────────────────────
  capacity_wh: 5000          # Battery capacity in Wh
  max_power_w: 2200          # Inverter/battery max power in W — final setpoint clamp

  # ── State-of-charge targets ─────────────────────────────────────────
  # Per-rule SOC targets.
  target_afternoon_charging: 70 # % SOC to reach before the evening peak (P3)
  target_peak_discharge: 70     # % SOC above which evening excess is sold (P4)
  target_morning_soc: 30        # % SOC to unload down to in the morning window (P5)
  soc_floor: 0              # % SOC floor — never discharge below this
  cheap_soc_target: 100      # % SOC ceiling for cheap-price charging

  # ── Pricing ─────────────────────────────────────────────────────────
  # A single market price sensor is used for both charge and discharge
  # decisions. Account for any buy/sell price difference via the margins below.
  price_discharge: 0.39      # Price above which to force discharge (P1)
  price_charge: 0.01         # Price below which to charge from grid (P2)
  min_arbitrage_margin: 0.05 # Min €/kWh spread for the evening hold-vs-sell decision (P4)
  afternoon_margin: 0.05     # Min €/kWh by which the evening peak import beats now to justify afternoon charge (P3)

  # ── Grid-connection guard (P0) ──────────────────────────────────────
  # Every setpoint is clamped so grid power stays within max_grid_w * grid_utilization.
  max_grid_w: 8000           # Physical connection limit in W (1x35A @ 230V ≈ 8 kW)
  grid_utilization: 0.9      # Fraction of the limit we allow

  # ── Adaptive spread window ──────────────────────────────────────────
  # Price-spike discharge and cheap charge spread over the contiguous run of
  # hours the price stays past the threshold, floored at min_window_h.
  # Wider spread = lower power = lower round-trip losses.
  min_window_h: 2.0          # Minimum spread window (hours)
  rerun_debounce_s: 2.0      # Delay before re-running after a live input changes

  # ── Time windows (local hours) ──────────────────────────────────────
  afternoon_start: 16
  afternoon_end: 18
  evening_peak_start: 20
  evening_peak_end: 22
  morning_selloff_start: 7
  morning_selloff_end: 9

  # ── Entity IDs (map these to your own Sessy entities) ───────────────
  strategy_select: select.sessy_battery_alt9_power_strategy
  grid_target: number.sessy_pwkn_grid_target
  battery_setpoint: number.sessy_battery_alt9_power_setpoint
  soc_sensor: sensor.sessy_battery_alt9_state_of_charge
  price_sensor: sensor.sessy_dnhh_energy_price
  # Optional live grid/house power sensor, used by the grid guard for battery
  # (api-mode) setpoints. Without it, only grid (nom-mode) setpoints are bounded.
  grid_power_sensor: sensor.sessy_pwkn_p1_power
  status_sensor: sensor.sessy_strategy_status

  # ── Operating-mode selector (master control) ────────────────────────
  # Provided by the Home Battery custom integration (custom_components/home_battery).
  # The single master control the app obeys. Options normalise to:
  # optimized | grid_setpoint | battery_setpoint | sessy_dynamic | eco | idle.
  mode_select: select.home_battery_mode
  # Single manual setpoint. The mode decides where it lands: grid_setpoint mode
  # writes it to the grid target, battery_setpoint mode to the battery power.
  setpoint_entity: number.home_battery_setpoint
  # Sessy power_strategy option strings used when handing control back.
  # Defaults match the ha-sessy integration — verify in Developer Tools and
  # override if your build uses different option strings.
  sessy_dynamic_option: roi
  eco_option: eco
  idle_option: idle

  # ── Optional live-tuning helpers ────────────────────────────────────
  # These let the app read live values from HA helpers each cycle so you can
  # tune them from a dashboard without restarting AppDaemon. The app falls back
  # to the static values above if a helper is missing or unreadable. Remove any
  # line to keep that value static.
  # SOC numbers and price thresholds all come from the Home Battery integration.
  target_afternoon_charging_entity: number.home_battery_target_afternoon_charging
  target_peak_discharge_entity: number.home_battery_target_peak_discharge
  target_morning_soc_entity: number.home_battery_target_morning_soc
  soc_floor_entity: number.home_battery_soc_floor
  cheap_soc_target_entity: number.home_battery_soc_ceiling
  price_discharge_entity: number.home_battery_price_discharge
  price_charge_entity: number.home_battery_price_charge
  min_arbitrage_margin_entity: number.home_battery_min_arbitrage_margin
  afternoon_margin_entity: number.home_battery_afternoon_margin

  # Per-rule enable switches (Home Battery integration). Omit to keep a rule
  # always enabled. The grid guard and default fall-through are always active.
  rule_price_spike_entity: switch.home_battery_rule_price_spike
  rule_cheap_charge_entity: switch.home_battery_rule_cheap_charge
  rule_afternoon_charge_entity: switch.home_battery_rule_afternoon_charge
  rule_evening_peak_entity: switch.home_battery_rule_evening_peak
  rule_morning_selloff_entity: switch.home_battery_rule_morning_selloff

boiler_strategy:
  module: boiler_strategy
  class: BoilerStrategy

  # ── Weekly legionella prevention ─────────────────────────────────────
  legionella_temp: 65             # C the boiler must reach periodically
  legionella_hybrid_days: 6       # Days without reaching legionella_temp before forcing hybrid
  legionella_boost_days: 7        # Days without reaching legionella_temp before forcing a boost

  # ── Economic mode windows (local hours, [start, end)) ────────────────
  # 'economic' runs the heat pump only during whichever of these two windows
  # has the lower average forecast price.
  economic_window1_start: 10
  economic_window1_end: 16
  economic_window2_start: 0
  economic_window2_end: 6

  rerun_debounce_s: 2.0

  # ── Entity IDs (map these to your own installation) ─────────────────
  temp_sensor: sensor.boiler_temperatuur       # Boiler water temperature (C)
  # Frank Energie forecast sensor exposing a `prices` list of {from, till, price}.
  price_forecast_sensor: sensor.frankenergy_current_electricity_market_price
  price_forecast_attribute: prices
  # User-selected strategy mode: economic | heatpump | hybrid | boost
  mode_select: input_select.boiler_strategy_mode
  # Logical actuator from the boiler package (off/heatpump/hybrid/boost/ariston_app)
  boiler_mode_select: select.boiler_mode
  # input_datetime helper this app stamps whenever the boiler reaches legionella_temp
  legionella_last_ok_entity: input_datetime.boiler_legionella_last_ok
  status_sensor: sensor.boiler_strategy_status

